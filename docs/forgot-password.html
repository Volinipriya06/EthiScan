<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthiScan - Forgot Password</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Reset password</h2>
        <p class="auth-subtitle">Enter your email to create a secure reset link.</p>

        <div id="authMessage" class="auth-message" aria-live="polite"></div>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="forgotEmail" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="auth-btn">Send Reset Link</button>

            <div class="auth-footer">
                <p>Remembered it? <a href="login.html">Sign in</a></p>
            </div>
        </form>
    </div>

    <script src="js/loader.js"></script>
</body>
</html>
