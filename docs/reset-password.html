<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthiScan - Reset Password</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Create new password</h2>
        <p class="auth-subtitle">Choose a fresh password for your EthiScan account.</p>

        <div id="authMessage" class="auth-message" aria-live="polite"></div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label>NEW PASSWORD</label>
                <input type="password" id="resetPassword" placeholder="Minimum 8 characters" minlength="8" required>
            </div>

            <div class="form-group">
                <label>CONFIRM PASSWORD</label>
                <input type="password" id="confirmResetPassword" placeholder="Re-enter password" minlength="8" required>
            </div>

            <button type="submit" class="auth-btn">Update Password</button>

            <div class="auth-footer">
                <p><a href="login.html">Back to sign in</a></p>
            </div>
        </form>
    </div>

    <script src="js/loader.js"></script>
</body>
</html>
